# Checks on Windows that Rust functions with `#[no_mangle]` in a crate above `skia-bindings` satisfy
# the calls from its C++ library (ADR 0003). The test is in `ci/rust-export-link`.
name: Windows Rust export link test

on:
  push:
    branches: [ci/windows-rust-export-link]
  workflow_dispatch:

jobs:
  link:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Link and run
      run: bash ci/rust-export-link/run.sh
      shell: bash

    # Bash shows only the low byte of a Windows exit code. PowerShell shows the full NTSTATUS,
    # such as 0xC0000005 for an access violation.
    - name: Full exit code of the debug app
      if: always()
      shell: pwsh
      run: |
        ci\rust-export-link\target\debug\app.exe
        "exit code: 0x{0:X8}" -f $LASTEXITCODE

    # Runs the debug app under the console debugger with full page heap, which stops at the first
    # invalid heap access, and prints the call stack there.
    - name: Stack trace of the debug app
      if: always() && matrix.os == 'windows-2022'
      shell: pwsh
      run: |
        $debuggers = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64"
        & "$debuggers\gflags.exe" /p /enable app.exe /full
        $app = "ci\rust-export-link\target\debug"
        & "$debuggers\cdb.exe" -g -lines -y $app -c ".lines -e; kP 40; q" "$app\app.exe"
        exit 0
