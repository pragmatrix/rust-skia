# Checks on Windows that Rust functions with `#[no_mangle]` in a crate above `skia-bindings` satisfy
# the calls from its C++ library (ADR 0003). The test is in `ci/rust-export-link`.
name: Windows Rust export link test

on:
  push:
    branches: [ci/windows-rust-export-link]
  workflow_dispatch:

jobs:
  link:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Link and run
      run: bash ci/rust-export-link/run.sh
      shell: bash
